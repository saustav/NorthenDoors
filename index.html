<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Northen Doors — Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Source+Sans+3:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Reset default browser spacing so the page fills the screen */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1c1612;
        color: #f4efe8;
        font-family: "Source Sans 3", sans-serif;
      }

      /* Soft glow behind the content, like light through a doorway */
      .page {
        width: min(640px, calc(100% - 40px));
        text-align: center;
        padding: 64px 28px;
        background:
          radial-gradient(ellipse at top, rgba(201, 162, 86, 0.12), transparent 55%),
          #241c16;
        border: 1px solid rgba(201, 162, 86, 0.28);
      }

      .brand {
        letter-spacing: 0.28em;
        text-transform: uppercase;
        font-size: 0.78rem;
        color: #c9a256;
        margin-bottom: 28px;
      }

      h1 {
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(3rem, 8vw, 5.2rem);
        font-weight: 500;
        line-height: 1;
        margin-bottom: 18px;
      }

      p {
        font-size: 1.05rem;
        line-height: 1.6;
        color: #d8cfc4;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <p class="brand">Northen Doors</p>
      <h1>Coming Soon</h1>
      <p>A new site is on the way.</p>
    </main>
  </body>
</html>
