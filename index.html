<style>
  @font-face { font-family: 'Fraunces'; src: url('fonts/fraunces-400.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: 'DM Sans'; src: url('fonts/dmsans-400.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
  :root { --charcoal:#262520; --cream:#F6F1E9; --sand:#E6D8C3; --terra:#B5532F; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--charcoal); color: var(--cream);
    font-family: 'DM Sans', system-ui, sans-serif;
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column;
    padding: clamp(24px, 5vw, 56px);
  }
  header { display: flex; justify-content: space-between; align-items: center; }
  header img { width: 98px; height: auto; display: block; }
  .date { font-size: 15px; letter-spacing: .18em; color: var(--sand); }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 1100px; width: 100%; margin: 0 auto; padding: 48px 0; }
  .q { font-size: clamp(20px, 3vw, 30px); color: var(--sand); margin: 0 0 12px; min-height: 1.4em; transition: opacity .5s ease; }
  h1 {
    font-family: 'Fraunces', Georgia, serif; font-weight: 400;
    font-size: clamp(96px, 27vw, 260px); line-height: .9; letter-spacing: -.02em; margin: 0;
  }
  h1 .dot { color: var(--terra); }
  .line { font-family: 'Fraunces', Georgia, serif; font-size: clamp(20px, 2.6vw, 28px); margin: 28px 0 0; color: var(--cream); }
  footer { display: flex; flex-wrap: wrap; gap: 16px 32px; justify-content: space-between; align-items: center; font-size: 15px; color: var(--sand); }
  footer nav { display: flex; gap: 24px; flex-wrap: wrap; }
  a { color: var(--sand); text-decoration: none; border-bottom: 1px solid rgba(230,216,195,.35); padding-bottom: 2px; }
  a:hover, a:focus-visible { color: var(--cream); border-color: var(--terra); outline: none; }
  @media (prefers-reduced-motion: reduce) { .q { transition: none; } }
</style>

<body>
  <header>

  <main>
    <p class="q" id="q" aria-live="polite">Chiya or coffee?</p>

  <footer>

    </nav>
  </footer>

<script>
  (function () {
    var qs = ["Chiya or coffee?", "Wi-Fi, a window, no rush?", "Meeting outside the office?", "First date, second coffee?", "Kasaiko birthday cha?", "New in Kathmandu?"];
    var el = document.getElementById('q'), i = 0;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    setInterval(function () {
      el.style.opacity = 0;
      setTimeout(function () { i = (i + 1) % qs.length; el.textContent = qs[i]; el.style.opacity = 1; }, 500);
    }, 3200);
  })();
</script>
